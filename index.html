function nr(){$("bc").textContent=N.length;$("np").innerHTML='<div class="card">'+(N.length?N.map(n=>`<div class="nt ${KC[n.k]}"><b>${esc(n.ti)}</b><div class="mu">${esc(n.bo)}, ${n.tm}</div></div>`).join(""):t("ne"))+"</div>"}
function notify(k,ti,bo,quiet){N.unshift({k,ti,bo,tm:new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})});nr();if(!quiet){const e=$("toast");e.textContent=ti;e.hidden=false;clearTimeout(notify.h);notify.h=setTimeout(()=>e.hidden=true,3500)}}
function chips(){const g={};P.forEach(p=>(g[p.reg]=g[p.reg]||[]).push(p));$("chips").innerHTML="<span>"+t("try")+"</span>"+Object.keys(g).map(r=>`<span class="rg"><b>${r}</b>${g[r].map(p=>`<button data-q="${p.id}">${p.id.slice(3)}</button>`).join("")}</span>`).join("");document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{$("q").value=b.dataset.q;run()})}
function post(p,s,vk){if(!seen[p.id]){seen[p.id]=1;notify("rep",t("nr")+" "+p.id,t("sc")+" "+s+", "+t(vk))}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const up=b.dataset.f==="1",ok=()=>{$("fb").innerHTML="<span>"+t("ty")+"</span>";try{const a=JSON.parse(localStorage.getItem("wazi_fb")||"[]");a.push({id:p.id,up,c:($("fc")||{}).value||""});localStorage.setItem("wazi_fb",JSON.stringify(a))}catch(e){}notify("fb",t("ty"),p.id)};if(up)return ok();$("fb").innerHTML=`<input id="fc" placeholder="${t("fp")}"><button class="pri" id="fs">${t("fs")}</button>`;$("fs").onclick=ok})}
$("bell").onclick=()=>{$("np").hidden=!$("np").hidden};
